# Test on every push to main and every pull request -- mypy and pytest, while a
# fix is still cheap. (build.py's nbconvert conversion is exercised by the
# tests, which build the sample notebook and serve it through a real site.)
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes an in-flight run pointless; drop it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q
